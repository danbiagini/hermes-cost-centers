[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-cost-centers"
version = "0.1.0.dev0"
description = "Cost accounting and budgets for a Hermes agent fleet"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "fastapi>=0.110", "httpx>=0.27"]

[project.scripts]
hermes-cost-centers = "hermes_cost_centers.cli:main"

[tool.setuptools.packages.find]
include = ["hermes_cost_centers*"]

[tool.setuptools.package-data]
hermes_cost_centers = ["prices.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
